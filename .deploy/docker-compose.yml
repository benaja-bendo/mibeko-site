x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  site:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: mibeko-site
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      # API Laravel consommée par le serveur SSR, par le réseau Docker `proxy`
      # que partagent `mibeko-site` et `mibeko-nginx` (vhost en `server_name _`) :
      # ni DNS public, ni TLS, ni Traefik pour un appel qui reste sur la machine
      # (mibeko-site#47). Surchargeable via .env (CI).
      - MIBEKO_API_URL=${MIBEKO_API_URL:-http://mibeko-nginx/api/v1}
      # Base PUBLIQUE, pour les seules URL servies dans le HTML au navigateur
      # (liens PDF) : un nom de conteneur n'existe pas hors du VPS.
      - MIBEKO_API_PUBLIC_URL=${MIBEKO_API_PUBLIC_URL:-https://api.mibeko.fr/api/v1}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.mibeko-site.rule=Host(`${MIBEKO_SITE_HOST:-mibeko.fr}`)"
      - "traefik.http.routers.mibeko-site.entrypoints=websecure"
      - "traefik.http.routers.mibeko-site.tls.certresolver=myresolver"
      - "traefik.http.routers.mibeko-site.priority=1"

      # Le DNS du .cg pointe déjà vers ce VPS. Le routeur HTTPS déclenche
      # le certificat des deux noms avant de rediriger vers le domaine canonique.
      # Le point d'entrée web de Traefik assure déjà HTTP → HTTPS.
      - "traefik.http.routers.mibeko-site-cg.rule=Host(`mibeko.cg`) || Host(`www.mibeko.cg`)"
      - "traefik.http.routers.mibeko-site-cg.entrypoints=websecure"
      - "traefik.http.routers.mibeko-site-cg.tls.certresolver=myresolver"
      - "traefik.http.routers.mibeko-site-cg.service=mibeko-site"
      - "traefik.http.routers.mibeko-site-cg.middlewares=mibeko-site-cg-canonical"
      - "traefik.http.middlewares.mibeko-site-cg-canonical.redirectregex.regex=^https?://(?:www[.])?mibeko[.]cg(?::[0-9]+)?/(.*)"
      # $$ protège la capture de l'interpolation Docker Compose.
      - "traefik.http.middlewares.mibeko-site-cg-canonical.redirectregex.replacement=https://mibeko.fr/$${1}"
      - "traefik.http.middlewares.mibeko-site-cg-canonical.redirectregex.permanent=true"

      # Serveur SSR Astro (adapter @astrojs/node) — écoute sur 4321.
      - "traefik.http.services.mibeko-site.loadbalancer.server.port=4321"

      - "dev.dozzle.group=mibeko"
      - "dev.dozzle.icon=astro"

networks:
  proxy:
    external: true
